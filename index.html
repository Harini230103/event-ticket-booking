<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login - Event Ticket Booking</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>Event Ticket Booking</h1>
        <nav>
            <a href="logout.html">Logout</a>
        </nav>
    </header>
    
    <main>
        <section id="login-section">
            <h2>Login</h2>
            <input type="text" id="login-email" placeholder="Email">
            <input type="password" id="login-password" placeholder="Password">
            <button onclick="loginUser()">Login</button>
            <p>Don't have an account? <a href="index.html">Register here</a></p>
        </section>
    </main>
    
    <script>
        function loginUser() {
            const email = document.getElementById("login-email").value.trim();
            const password = document.getElementById("login-password").value.trim();

            if (!email || !password) {
                alert("Please enter both email and password.");
                return;
            }

            // Simulated authentication (you can replace this with a real authentication check)
            if (email === "user@example.com" && password === "password123") {
                alert("Login successful! Redirecting to dashboard...");
                window.location.href = "dashboard.html"; // Ensure dashboard.html exists
            } else {
                alert("Invalid email or password. Please try again.");
            }
        }
    </script>
</body>
</html>
